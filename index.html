<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>씨네박스 · 한국 영화 데이터베이스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0d;
    --bg-alt:#131215;
    --card:#18171b;
    --card-hover:#201f24;
    --red:#c8203a;
    --red-dim:#7a1526;
    --gold:#d4af37;
    --text:#ede9e4;
    --muted:#8d8a92;
    --line:#2a292e;
    --radius:2px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
  }
  ::selection{ background:var(--red); color:#fff; }

  /* film sprocket strip motif */
  .sprocket-rule{
    height:14px;
    background-image: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 18px);
    opacity:.5;
  }

  header{
    position:sticky; top:0; z-index:50;
    background:rgba(11,11,13,.92);
    backdrop-filter: blur(8px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:1200px; margin:0 auto;
    padding:18px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:24px;
  }
  .logo{
    font-family:'Black Han Sans', sans-serif;
    font-size:26px;
    letter-spacing:1px;
    color:var(--text);
    display:flex; align-items:baseline; gap:6px;
    cursor:pointer;
  }
  .logo span{ color:var(--red); }
  nav.tabs{ display:flex; gap:4px; }
  .tab-btn{
    background:none; border:none; color:var(--muted);
    font-family:'Noto Sans KR'; font-weight:700; font-size:14px;
    padding:10px 16px; cursor:pointer; letter-spacing:.5px;
    border-bottom:2px solid transparent;
    transition:.15s;
  }
  .tab-btn.active, .tab-btn:hover{ color:var(--text); border-bottom-color:var(--red); }

  .search-wrap{ position:relative; flex:1; max-width:360px; }
  .search-wrap input{
    width:100%;
    background:var(--bg-alt);
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 14px;
    font-family:'Noto Sans KR';
    font-size:14px;
    border-radius:var(--radius);
    outline:none;
  }
  .search-wrap input:focus{ border-color:var(--red); }
  .search-results{
    position:absolute; top:calc(100% + 6px); left:0; right:0;
    background:var(--card); border:1px solid var(--line);
    max-height:420px; overflow-y:auto; z-index:60; display:none;
  }
  .search-results.show{ display:block; }
  .sr-item{ display:flex; gap:10px; padding:8px 10px; cursor:pointer; border-bottom:1px solid var(--line); }
  .sr-item:hover{ background:var(--card-hover); }
  .sr-item img{ width:36px; height:54px; object-fit:cover; background:var(--bg-alt); flex-shrink:0; }
  .sr-item .sr-meta{ font-size:12px; color:var(--muted); }
  .sr-item .sr-title{ font-weight:700; font-size:13px; }

  main{ max-width:1200px; margin:0 auto; padding:32px 24px 80px; }

  /* HERO */
  #hero{
    position:relative; height:56vh; min-height:380px;
    display:flex; align-items:flex-end;
    margin:-1px -24px 40px;
    overflow:hidden;
    background:var(--bg-alt);
  }
  #hero .hero-bg{
    position:absolute; inset:0;
    background-size:cover; background-position:center top;
    filter:saturate(1.05);
  }
  #hero .hero-fade{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(11,11,13,0) 0%, rgba(11,11,13,.55) 55%, var(--bg) 100%),
               linear-gradient(90deg, rgba(11,11,13,.85) 0%, rgba(11,11,13,0) 55%);
  }
  .hero-content{ position:relative; padding:0 48px 40px; max-width:640px; }
  .hero-eyebrow{
    font-size:12px; letter-spacing:3px; color:var(--red); font-weight:700; margin-bottom:10px;
  }
  .hero-title{
    font-family:'Black Han Sans'; font-size:44px; line-height:1.1; margin-bottom:12px;
    text-shadow:0 2px 12px rgba(0,0,0,.6);
  }
  .hero-overview{ color:var(--text); font-size:14px; line-height:1.7; opacity:.9; margin-bottom:20px; max-width:520px; }
  .hero-btn{
    background:var(--red); color:#fff; border:none; padding:12px 26px;
    font-weight:700; font-size:14px; cursor:pointer; letter-spacing:.5px;
    display:inline-flex; align-items:center; gap:8px;
  }
  .hero-btn:hover{ background:#e0263f; }

  section.row{ margin-bottom:44px; }
  .row-head{
    display:flex; align-items:baseline; gap:12px; margin-bottom:16px;
    padding-left:2px; border-left:4px solid var(--red); padding-left:12px;
  }
  .row-head h2{ font-family:'Black Han Sans'; font-size:22px; letter-spacing:.5px; }
  .row-head .row-num{ color:var(--muted); font-size:13px; font-weight:700; }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:18px;
  }
  .poster-card{ cursor:pointer; position:relative; }
  .poster-frame{
    position:relative; aspect-ratio:2/3; background:var(--card);
    overflow:hidden; border:1px solid var(--line);
    transition:transform .18s, border-color .18s;
  }
  .poster-card:hover .poster-frame{ transform:translateY(-4px); border-color:var(--red); }
  .poster-frame img{ width:100%; height:100%; object-fit:cover; display:block; }
  .poster-badge{
    position:absolute; top:6px; right:6px;
    background:rgba(0,0,0,.75); color:var(--gold);
    font-size:11px; font-weight:700; padding:2px 6px;
    display:flex; align-items:center; gap:3px;
  }
  .poster-title{ margin-top:8px; font-size:13px; font-weight:700; line-height:1.35; }
  .poster-sub{ font-size:11px; color:var(--muted); margin-top:2px; }

  .loading, .empty{ color:var(--muted); padding:40px 0; text-align:center; font-size:14px; }

  /* DETAIL VIEW */
  #detail{ display:none; }
  #detail.show{ display:block; }
  #home-view.hidden{ display:none; }

  .back-btn{
    background:none; border:1px solid var(--line); color:var(--muted);
    padding:8px 16px; font-size:13px; font-weight:700; cursor:pointer;
    margin-bottom:20px; letter-spacing:.5px;
  }
  .back-btn:hover{ color:var(--text); border-color:var(--red); }

  .detail-hero{
    position:relative; min-height:340px; margin:0 -24px 32px; padding:40px 48px;
    display:flex; gap:32px; align-items:flex-end; flex-wrap:wrap;
  }
  .detail-hero .hero-bg, .detail-hero .hero-fade{ position:absolute; inset:0; }
  .detail-poster{
    position:relative; width:180px; flex-shrink:0;
    border:3px solid var(--bg); box-shadow:0 8px 30px rgba(0,0,0,.6);
  }
  .detail-poster img{ width:100%; display:block; }
  .detail-info{ position:relative; flex:1; min-width:280px; padding-bottom:6px; }
  .detail-eyebrow{ color:var(--red); font-size:12px; font-weight:700; letter-spacing:3px; margin-bottom:8px; }
  .detail-title{ font-family:'Black Han Sans'; font-size:38px; line-height:1.15; margin-bottom:6px; }
  .detail-orig{ color:var(--muted); font-size:14px; margin-bottom:14px; }
  .detail-meta{ display:flex; flex-wrap:wrap; gap:14px; font-size:13px; color:var(--text); margin-bottom:16px; }
  .detail-meta .m-item{ display:flex; align-items:center; gap:5px; }
  .detail-meta .star{ color:var(--gold); }
  .genre-pill{
    border:1px solid var(--line); padding:4px 12px; font-size:12px; color:var(--muted);
  }
  .genre-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .tagline{ font-style:italic; color:var(--muted); font-size:14px; margin-bottom:10px; }

  .section-block{ margin-bottom:40px; }
  .section-block h3{
    font-family:'Black Han Sans'; font-size:20px; margin-bottom:14px;
    border-left:4px solid var(--red); padding-left:12px;
  }
  .bio-text{ font-size:15px; line-height:1.9; color:var(--text); opacity:.92; max-width:820px; white-space:pre-line; }

  .cast-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:16px; }
  .cast-card img{ width:100%; aspect-ratio:2/3; object-fit:cover; background:var(--card); border:1px solid var(--line); }
  .cast-name{ font-size:12px; font-weight:700; margin-top:6px; }
  .cast-role{ font-size:11px; color:var(--muted); }

  .trailer-wrap{ position:relative; width:100%; max-width:860px; aspect-ratio:16/9; background:var(--card); border:1px solid var(--line); }
  .trailer-wrap iframe{ width:100%; height:100%; border:none; }
  .no-trailer{ color:var(--muted); font-size:14px; padding:24px; border:1px dashed var(--line); max-width:860px; }

  /* seasons/episodes */
  .season-list{ display:flex; flex-direction:column; gap:10px; max-width:900px; }
  .season-item{ border:1px solid var(--line); background:var(--card); }
  .season-head{
    display:flex; align-items:center; gap:14px; padding:14px 16px; cursor:pointer;
  }
  .season-head:hover{ background:var(--card-hover); }
  .season-head img{ width:46px; height:68px; object-fit:cover; background:var(--bg-alt); }
  .season-head .s-title{ font-weight:700; font-size:15px; }
  .season-head .s-meta{ font-size:12px; color:var(--muted); margin-top:2px; }
  .season-head .chev{ margin-left:auto; color:var(--muted); transition:transform .15s; }
  .season-item.open .chev{ transform:rotate(90deg); color:var(--red); }
  .episode-panel{ display:none; border-top:1px solid var(--line); padding:8px 16px 16px; }
  .season-item.open .episode-panel{ display:block; }
  .episode-row{
    display:flex; gap:14px; padding:12px 6px; border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .episode-row:last-child{ border-bottom:none; }
  .episode-row:hover{ background:var(--card-hover); }
  .episode-row img{ width:120px; height:68px; object-fit:cover; background:var(--bg-alt); flex-shrink:0; }
  .ep-num{ color:var(--red); font-weight:900; font-size:13px; margin-bottom:2px; }
  .ep-title{ font-weight:700; font-size:14px; margin-bottom:4px; }
  .ep-meta{ font-size:11px; color:var(--muted); margin-bottom:6px; }
  .ep-overview{ font-size:12.5px; color:var(--muted); line-height:1.6; max-width:640px; }

  footer{
    border-top:1px solid var(--line); padding:24px; text-align:center;
    color:var(--muted); font-size:12px;
  }
  footer a{ color:var(--muted); }

  #apikey-modal{
    position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:200;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  #apikey-modal.hidden{ display:none; }
  .modal-box{
    background:var(--card); border:1px solid var(--line); padding:28px; max-width:420px; width:100%;
  }
  .modal-box h3{ font-family:'Black Han Sans'; margin-bottom:10px; font-size:20px; }
  .modal-box p{ font-size:13px; color:var(--muted); margin-bottom:14px; line-height:1.6; }
  .modal-box input{
    width:100%; background:var(--bg-alt); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; margin-bottom:12px; font-family:monospace; font-size:13px;
  }
  .modal-box button{
    background:var(--red); color:#fff; border:none; padding:10px 20px; font-weight:700; cursor:pointer;
  }

  @media (max-width:640px){
    .hero-title, .detail-title{ font-size:28px; }
    #hero{ height:auto; padding-top:60vw; }
    .hero-content{ padding:0 20px 28px; }
    .detail-hero{ padding:24px 20px; flex-direction:column; }
    header .header-inner{ flex-wrap:wrap; gap:12px; }
    .search-wrap{ order:3; max-width:100%; }
  }
</style>
</head>
<body>

<div id="apikey-modal">
  <div class="modal-box">
    <h3>TMDB API 키 입력</h3>
    <p>이 사이트는 TMDB(The Movie Database) 공개 API를 사용해 영화·시리즈 정보를 한국어로 불러옵니다. API 키를 입력해주세요.</p>
    <input id="apikey-input" type="text" placeholder="TMDB API Key (v3 auth)">
    <button id="apikey-save">저장하고 시작하기</button>
  </div>
</div>

<header>
  <div class="header-inner">
    <div class="logo" id="logo-home">씨네<span>박스</span></div>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="movie">영화</button>
      <button class="tab-btn" data-tab="tv">시리즈</button>
    </nav>
    <div class="search-wrap">
      <input id="search-input" type="text" placeholder="제목 검색...">
      <div class="search-results" id="search-results"></div>
    </div>
  </div>
</header>

<main>
  <div id="home-view">
    <div id="hero"></div>
    <div id="rows"></div>
  </div>

  <div id="detail"></div>
</main>

<footer>
  <p>씨네박스 — TMDB 공개 데이터를 사용한 영화·시리즈 정보 사이트 (스트리밍 서비스 아님) · Powered by <a href="https://www.themoviedb.org/" target="_blank">TMDB</a></p>
</footer>

<script>
const IMG = 'https://image.tmdb.org/t/p/';
const API = 'https://api.themoviedb.org/3';
let API_KEY = localStorage.getItem('tmdb_key') || '513182919ede525d4b5c8292e15b3c06';
let currentTab = 'movie';

// ---------- API key modal ----------
function checkKey(){
  document.getElementById('apikey-modal').classList.add('hidden');
  init();
}
document.getElementById('apikey-save').addEventListener('click', ()=>{
  const v = document.getElementById('apikey-input').value.trim();
  if(!v) return;
  API_KEY = v;
  localStorage.setItem('tmdb_key', v);
  checkKey();
});

async function tmdb(path, params={}){
  const url = new URL(API + path);
  url.searchParams.set('api_key', API_KEY);
  url.searchParams.set('language', 'ko-KR');
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const res = await fetch(url);
  if(!res.ok) throw new Error('TMDB error ' + res.status);
  return res.json();
}

function img(path, size='w500'){
  return path ? IMG + size + path : 'https://placehold.co/342x513/17171b/8d8a92?text=No+Image';
}

// ---------- HOME ----------
async function init(){
  await loadHero();
  await loadRows();
}

async function loadHero(){
  const data = await tmdb(currentTab === 'movie' ? '/trending/movie/week' : '/trending/tv/week');
  const item = data.results[0];
  if(!item) return;
  const hero = document.getElementById('hero');
  const title = item.title || item.name;
  hero.innerHTML = `
    <div class="hero-bg" style="background-image:url('${img(item.backdrop_path,'original')}')"></div>
    <div class="hero-fade"></div>
    <div class="hero-content">
      <div class="hero-eyebrow">이번 주 화제작</div>
      <div class="hero-title">${title}</div>
      <div class="hero-overview">${(item.overview || '등록된 소개가 없습니다.').slice(0,180)}${item.overview && item.overview.length>180 ? '…' : ''}</div>
      <button class="hero-btn" onclick="openDetail(${item.id}, '${currentTab}')">자세히 보기 ▸</button>
    </div>
  `;
}

const ROWS = {
  movie: [
    {key:'01', title:'지금 뜨는 영화', path:'/trending/movie/week'},
    {key:'02', title:'인기 영화', path:'/movie/popular'},
    {key:'03', title:'최고 평점 영화', path:'/movie/top_rated'},
    {key:'04', title:'개봉 예정작', path:'/movie/upcoming'},
  ],
  tv: [
    {key:'01', title:'지금 뜨는 시리즈', path:'/trending/tv/week'},
    {key:'02', title:'인기 시리즈', path:'/tv/popular'},
    {key:'03', title:'최고 평점 시리즈', path:'/tv/top_rated'},
    {key:'04', title:'방영 중인 시리즈', path:'/tv/on_the_air'},
  ]
};

async function loadRows(){
  const rowsEl = document.getElementById('rows');
  rowsEl.innerHTML = '';
  const defs = ROWS[currentTab];
  for(const def of defs){
    const section = document.createElement('section');
    section.className = 'row';
    section.innerHTML = `
      <div class="row-head"><span class="row-num">${def.key}</span><h2>${def.title}</h2></div>
      <div class="grid loading-grid"><div class="loading">불러오는 중...</div></div>
    `;
    rowsEl.appendChild(section);
    try{
      const data = await tmdb(def.path);
      const grid = section.querySelector('.grid');
      grid.innerHTML = data.results.slice(0,12).map(item=>posterCard(item, currentTab)).join('');
    }catch(e){
      section.querySelector('.grid').innerHTML = `<div class="empty">불러오지 못했습니다.</div>`;
    }
  }
}

function posterCard(item, type){
  const title = item.title || item.name;
  const date = (item.release_date || item.first_air_date || '').slice(0,4);
  const rating = item.vote_average ? item.vote_average.toFixed(1) : '-';
  return `
    <div class="poster-card" onclick="openDetail(${item.id}, '${type}')">
      <div class="poster-frame">
        <img src="${img(item.poster_path)}" alt="${title}" loading="lazy">
        <div class="poster-badge">★ ${rating}</div>
      </div>
      <div class="poster-title">${title}</div>
      <div class="poster-sub">${date || '연도 미상'}</div>
    </div>
  `;
}

// ---------- TABS ----------
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    showHome();
    init();
  });
});
document.getElementById('logo-home').addEventListener('click', showHome);

function showHome(){
  document.getElementById('home-view').classList.remove('hidden');
  document.getElementById('detail').classList.remove('show');
}

// ---------- SEARCH ----------
let searchTimeout;
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
searchInput.addEventListener('input', ()=>{
  clearTimeout(searchTimeout);
  const q = searchInput.value.trim();
  if(!q){ searchResults.classList.remove('show'); return; }
  searchTimeout = setTimeout(()=>doSearch(q), 350);
});
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.search-wrap')) searchResults.classList.remove('show');
});

async function doSearch(q){
  try{
    const data = await tmdb('/search/multi', {query:q});
    const items = data.results.filter(r=>r.media_type==='movie' || r.media_type==='tv').slice(0,8);
    if(!items.length){
      searchResults.innerHTML = `<div class="empty" style="padding:16px;">검색 결과가 없습니다.</div>`;
    } else {
      searchResults.innerHTML = items.map(item=>{
        const title = item.title || item.name;
        const date = (item.release_date || item.first_air_date || '').slice(0,4);
        const typeLabel = item.media_type === 'movie' ? '영화' : '시리즈';
        return `
          <div class="sr-item" onclick="searchResults.classList.remove('show'); searchInput.value=''; openDetail(${item.id}, '${item.media_type}')">
            <img src="${img(item.poster_path,'w92')}">
            <div>
              <div class="sr-title">${title}</div>
              <div class="sr-meta">${typeLabel} · ${date || '연도 미상'}</div>
            </div>
          </div>
        `;
      }).join('');
    }
    searchResults.classList.add('show');
  }catch(e){}
}

// ---------- DETAIL ----------
async function openDetail(id, type){
  document.getElementById('home-view').classList.add('hidden');
  const detail = document.getElementById('detail');
  detail.classList.add('show');
  detail.innerHTML = `<div class="loading">불러오는 중...</div>`;
  window.scrollTo(0,0);

  try{
    if(type === 'movie'){
      await renderMovieDetail(id);
    } else {
      await renderTvDetail(id);
    }
  }catch(e){
    detail.innerHTML = `<button class="back-btn" onclick="showHome()">← 돌아가기</button><div class="empty">정보를 불러오지 못했습니다.</div>`;
  }
}

function genreRow(genres){
  if(!genres || !genres.length) return '';
  return `<div class="genre-row">${genres.map(g=>`<span class="genre-pill">${g.name}</span>`).join('')}</div>`;
}

function trailerBlock(videos){
  const trailer = (videos.results||[]).find(v=>v.site==='YouTube' && v.type==='Trailer')
                || (videos.results||[]).find(v=>v.site==='YouTube');
  if(!trailer){
    return `<div class="no-trailer">등록된 예고편이 없습니다.</div>`;
  }
  return `
    <div class="trailer-wrap">
      <iframe src="https://www.youtube.com/embed/${trailer.key}" title="trailer" allowfullscreen></iframe>
    </div>
  `;
}

function castGrid(credits){
  const cast = (credits.cast||[]).slice(0,12);
  if(!cast.length) return `<div class="empty">출연 정보가 없습니다.</div>`;
  return `<div class="cast-grid">${cast.map(c=>`
    <div class="cast-card">
      <img src="${img(c.profile_path,'w185')}">
      <div class="cast-name">${c.name}</div>
      <div class="cast-role">${c.character || ''}</div>
    </div>
  `).join('')}</div>`;
}

async function toggleSeason(headEl){
  const item = headEl.parentElement;
  const isOpen = item.classList.contains('open');
  document.querySelectorAll('.season-item.open').forEach(el=>{
    if(el !== item) el.classList.remove('open');
  });
  item.classList.toggle('open');
  if(isOpen) return;

  const panel = item.querySelector('.episode-panel');
  const tvId = item.dataset.tv;
  const seasonNum = item.dataset.season;
  if(panel.dataset.loaded === '1') return;

  panel.innerHTML = `<div class="loading">불러오는 중...</div>`;
  try{
    const data = await tmdb(`/tv/${tvId}/season/${seasonNum}`);
    panel.innerHTML = (data.episodes||[]).map(ep=>`
      <div class="episode-row" onclick="event.stopPropagation()">
        <img src="${img(ep.still_path,'w300')}">
        <div>
          <div class="ep-num">EP ${ep.episode_number}</div>
          <div class="ep-title">${ep.name}</div>
          <div class="ep-meta">${ep.air_date || '방영일 미상'} · ★ ${ep.vote_average ? ep.vote_average.toFixed(1) : '-'}</div>
          <div class="ep-overview">${ep.overview || '등록된 소개가 없습니다.'}</div>
        </div>
      </div>
    `).join('') || `<div class="empty">에피소드 정보가 없습니다.</div>`;
    panel.dataset.loaded = '1';
  }catch(e){
    panel.innerHTML = `<div class="empty">에피소드를 불러오지 못했습니다.</div>`;
  }
}

checkKey();
